<!DOCTYPE html>
<html lang="ja">
  
<head>
<meta charset=UTF-8>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Poetry | Waterland</title>
<style>

/* ページ全体 */

body {
  margin: 0;
  padding: 0;
  background: #dce3e8;
  font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  color: #34434d;
}

/* タイトル */

header {
  text-align: center;
  padding: 40px 20px 20px;
}

header h1 {
  font-size: 32px;
  font-weight: normal;
  letter-spacing: 5px;

}

header p {
  font-size: 13px;
  letter-spacing: 3px;
}

/* 詩のページ */

.poetry-page {
  background: #f5f1e7;
  max-width: 650px;
  min-height: 500px;
  margin: 30px auto;
  padding: 50px 30px;
  box-sizing: border-box;
  text-align: center;
  border-radius: 3px;
}

/* 詩のタイトル */

#poem-title {
  font-size:25px;
  font-weight: normal;
  letter-spacing: 3px;
  margin-bottom: 40px;
}

/* 詩の本文 */

#poem-text {
  font-size: 16px;
  line-height: 2.5;
  white-space: pre-line;
  letter-spacing: 1px;
}

/* 制作年 */

#poem-year {
  margin-top: 50px;
  font-size: 13px;
  color: #89949b;
}

/* ページ移動 */

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
  margin: 30px 10px;
}

button {
  background: transparent;
  border: 1px solid #89949b;
  padding: 12px 20px;
  color: #34434d;
  font-family: inherit;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #34434d;
  color: #ffffff;
}

#page-number {
  font-size: 14px;
}

/* HOMEリンク */

.home {
  text-align: center;
  padding: 30px;
}

.home a {
  color: #34434d;
  text-decoration: none;
  letter-spacing: 2px;
}

/* スマートフォン対応 */

@media (max-width: 600px) {

  header h1 {
    font-size: 25px;
  }

  .poetry-page {
    margin: 20px 15px;
    padding: 40px 20px;
    min-height: 450px;
  }

  #poem-title {
    font-size: 21px;
  }

  #poem-text {
    font-size: 14px;
  }

  .navigation {
    gap: 10px;
  }

  button {
    padding: 10px 12px;
    font-size: 12px;
  }

}

.poem-text {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    line-height: 2.2;
    text-align: center;
    padding: 30px 20px;
    font-size: 16px;
    max-width: 100%;
    box-sizing: border-box;
}

</style>
</head>

<body>

<header>
  <h1>Poetry</h1>
  <p>詩集 ー Waterland</p>
</header>

<main>

  <section class="poetry-page">

    <h2 id="poem-title"></h2>

    <div id="poem-text"></div>

    <p id="poem-year">2026</p>

  </section>

  <div class="navigation">

    <button onclick="changePoem(-1)">
      ← 前の詩
    </button>

    <span id="page-number"></span>

    <button onclick="changePoem(1)">
      次の詩→
    </button>
    
  </div>
  
</main>

<div class="home">
  <a href="index.html">←HOME</a>
</div>

<script>

// 詩のデータ

const poems = [

  {
    title: "君に出逢いし　初夏の風",
    text:　`君に贈りたい　わたくしの
    
    今日という日は　過ぎていく
           
    百万光年　過ぎようと

    君といた日は　終わらない

    火花のように輝け

    未来のカケラも

    君も　私も`,
    year: "2026"
  },

  {
    title: "君と私が出逢った場所まで",
    text: `水面に輝く　光の輪が

    水底をも照らす

    深く　深く　潜ってゆく

    君と私が　出逢った場所まで`,
    year: "2026"        
},

  {

    title: "百日紅のうた",
    text: `夏は往く

    百日紅のうた　歌わせて

    すべての花は　祝福を謳う

    あなたと私の歩く道なり`,
    year: "2026"
  },

  {

    title: "一輪の椿",
    text: `『　椿を見たら

    心の中で　俺の名まえを呼びなさい。

    それが　一生の約束になる。』`,
    year: "2026"
  },

  {

    title: "露草の灯り",
    text: `君と私の手と手が触れた

    露草の

    青いあかりを灯す

    国道沿い`,
    year: "2026"
    
  },

  {

    title: "君だけを",
    text: `君とだけ

    君と話すときだけ

    私の胸が　きゅっとする

    やっぱり　君に恋してる`,
    year: "2026"

  },

  {

    title: "CloZzz..",
    text: `君の　優しい気配を

    私のクローゼットに

    閉じ込めて

    今夜も　そうっと

    君を　見ている`,
    year: "2026"

  },

  {

    title: "ホットチョコレートの恋",
    text: `あなたの声が　恋しくて

    ついつい　話が長くなる

    秋の夜長に

    温めた　ホットチョコレート`,
    year: "2026"

  },

  {

    title: "ぼくの体温計",
    text: `あなたの優しい　さみしさが

    私を想ってくれたなら

    あなたの　腕の中に

    私の36.8°Cを

    置いてくれるの、？`,
    year: "2026"

  },

  {

    title: "BOKU-NO,AI",
    text: `君と出逢って
    
    ぼくは

    人生が　こんなにも

    楽しくて

    愛おしいものだと

    知った

    あいしてる`,
    year: "2026"
    
  },

  {

    title: "七番目の波",
    text: `波を数えては

    幾度目の夕あかり

    君に贈るよ

    Re:のつづき`,
    year: "2026"

  },

  {

    title: "Snow Flowers",
    text: `白い花

    君の耳元を

    小さく　飾って

    白い雪

    大地を　眠らせて

    君だけは　消えないでいて`,
    year: "2026"

  },

  {

    title: "萩の花咲く",
    text: `もえいづる

    花芽のように　君の咲く

    あるき初めにし

    萩の花のみち　ゆく`,
    year: "2026"

  },

];

// 現在のページ 

let currentPoem = 0;

// 詩を表示する関数

function showPoem() {

document.getElementById("poem-title").textContent = poems[currentPoem].title;

document.getElementById("poem-text").textContent = poems[currentPoem].text;

document.getElementById("poem-year").textContent = poems[currentPoem].year;

document.getElementById("page-number").textContent = (currentPoem + 1) + " / " +poems.length;

}

// 前後のページへ移動 

function changePoem(direction) {

  currentPoem += direction;

  if (currentPoem < 0) {
      currentPoem = poems.length - 1;
  }

  if (currentPoem >=poems.length) {
      currentPoem = 0;
  }

  showPoem();

}

// 最初の詩を表示

showPoem();

</script>

</body>
</html>
